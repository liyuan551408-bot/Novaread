<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Neural Graph View</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <style>
        body {
            background-color: #2E3440; /* Dark background aligned with the NordDark theme */
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        #cy {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
<div id="cy"></div>

<script>
    var cy = cytoscape({
        container: document.getElementById('cy'),

        // Sci-fi neon style definitions
        style: [
            {
                selector: 'node',
                style: {
                    'background-color': '#88C0D0', // Node color (Nord Cyan)
                    'label': 'data(label)',
                    'color': '#ECEFF4', // Text color
                    'font-size': '12px',
                    'text-valign': 'center',
                    'text-halign': 'center',
                    'width': 'label', // Width follows label text
                    'height': 'label',
                    'padding': '8px',
                    'shape': 'round-rectangle',
                    'border-width': 1,
                    'border-color': '#81A1C1',
                    'text-wrap': 'wrap',
                    'text-max-width': '80px'
                }
            },
            {
                selector: 'edge',
                style: {
                    'width': 2,
                    'line-color': '#BF616A', // Edge color (Nord Red)
                    'target-arrow-color': '#BF616A',
                    'target-arrow-shape': 'triangle',
                    'curve-style': 'bezier',
                    'label': 'data(label)',
                    'color': '#D8DEE9',
                    'font-size': '10px',
                    'text-rotation': 'autorotate',
                    'text-background-color': '#2E3440',
                    'text-background-opacity': 1,
                    'text-background-padding': '2px'
                }
            }
        ],
        // Default layout algorithm
        layout: {
            name: 'cose', // Use force-directed Cose layout to spread nodes automatically
            animate: true,
            padding: 30
        }
    });

    // Core function called by Java: receive JSON data and render it
    function renderNewGraph(jsonData) {
        cy.elements().remove(); // Clear the previous graph
        try {
            // Parse the JSON string passed from Java and add elements
            cy.add(JSON.parse(jsonData));
            // Rerun the layout for the new data
            cy.layout({
                name: 'cose',
                animate: true,
                idealEdgeLength: 100,
                nodeOverlap: 20,
                refresh: 20,
                fit: true,
                padding: 30,
                randomize: false,
                componentSpacing: 100,
                nodeRepulsion: 400000,
                edgeElasticity: 100,
                nestingFactor: 5,
            }).run();
        } catch (e) {
            console.error("Graph data parse failed:", e);
            alert("Graph data is invalid and cannot be rendered.");
        }
    }
</script>
</body>
</html>
